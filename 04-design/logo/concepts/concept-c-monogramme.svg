      <path d="M22 26h36"/><path d="M40 26v32"/>
      <path d="M22 58h36"/>
    </g>
  </g>
  <text x="116" y="78" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="600" letter-spacing="2.1" fill="#18221B">THÉ TIP TOP</text>
</svg>
