<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1448" width="720" height="1448" role="img" aria-label="Zoning connexion-inscription, tablette">
  <title>Zoning connexion-inscription, tablette</title>
  <rect width="720" height="1448" fill="#FFFFFF"/>
