  <text x="0" y="29" font-family="Helvetica,sans-serif" font-size="9" fill="#5B675E">Mesuré sur le site déployé. Largeur 820 px, hauteur totale 1608 px.</text>
  <g transform="translate(0,36)">
  <rect x="0" y="0" width="720" height="64" fill="#D7E3DA" stroke="#18221B"/>
