  <text x="10" y="32" font-family="Helvetica,sans-serif" font-size="9" fill="#5B675E">820 x 73 px</text>
  <rect x="163" y="113" width="393" height="619" fill="#EFEFE8" stroke="#18221B"/>
  <text x="173" y="131" font-family="Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#18221B">Se connecter</text>
  <text x="173" y="145" font-family="Helvetica,sans-serif" font-size="9" fill="#5B675E">448 x 705 px</text>
  <rect x="0" y="852" width="720" height="560" fill="#D5D5CC" stroke="#18221B"/>
  <text x="10" y="870" font-family="Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#18221B">Pied de page</text>
  <text x="10" y="884" font-family="Helvetica,sans-serif" font-size="9" fill="#5B675E">820 x 638 px</text>
  </g>
</svg>