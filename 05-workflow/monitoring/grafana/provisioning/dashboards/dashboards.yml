apiVersion: 1

providers:
  - name: theetiptop
    folder: Thé Tip Top
    type: file
    # Read-only in the UI on purpose. An edit made in the browser would be overwritten on
    # the next restart, and silently losing somebody's work is worse than refusing it.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
