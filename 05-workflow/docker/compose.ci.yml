# Throw-away infrastructure for the integration-test stage of the pipeline.
#
# Separate from compose.dev.yml on purpose. The developer file keeps its data between
# sessions, losing the 500,000 generated codes on every `down` would make local work
# miserable, whereas a CI run must start from nothing, every time, or a test can pass on
# residue left by the previous build.
#
# Jenkins runs it under a per-build project name so two concurrent builds never share a
# database:
#   docker compose -f compose.ci.yml -p ci-$BUILD_NUMBER up -d --wait
#   docker compose -f compose.ci.yml -p ci-$BUILD_NUMBER down -v

name: theetiptop-ci

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: theetiptop
      POSTGRES_PASSWORD: theetiptop
      POSTGRES_DB: theetiptop_ci
      # Same deterministic collation as every other environment. A different one would
      # change how the unique index on `code` orders and compares, so a green CI would
      # mean nothing about production.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # Port 0 lets the kernel pick a free one, so parallel builds on the same agent do not
      # fight over 5432. The test job reads the mapped port back from `docker compose port`.
      - '5432'
    command:
      - postgres
      # Everything in RAM and no durability: this database is deleted minutes from now, so
      # paying for crash safety buys nothing and the integration suite runs noticeably
      # faster. The production tuning is in compose.prod.yml and is deliberately different.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    tmpfs:
      # No volume at all: the data directory is a RAM disk that cannot outlive the
      # container, which removes the one way a CI database leaks into the next build.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U theetiptop -d theetiptop_ci']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '6379'
    command:
      - redis-server
      - --appendonly
      - 'no'
      - --save
      - ''
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
